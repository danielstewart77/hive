services:
  hive:
    build: .
    container_name: hive-site
    restart: unless-stopped
    ports:
      - "8710:8710"
    env_file: .env
    environment:
      - HIVE_HOST=0.0.0.0
      - HIVE_DB_PATH=/data/hive.db
      - LUCENT_DB_PATH=/lucent/lucent.db
      # Parent domain so the session cookie is shared with the terminal
      # site, which mounts the same auth db and secret.
      - HIVE_COOKIE_DOMAIN=sparktobloom.com
    volumes:
      - ./src:/app/src
      # Auth db — shared with the terminal site.
      - ./data:/data
      # Lucent sqlite, read-only, for the /memory browser. hive_nervous_system
      # retired 2026-07-24 — lucent now lives in hive_mind's own nervous-system/.
      - ${LUCENT_DB_HOST_DIR:-/home/daniel/Storage/Dev/hive_mind/nervous-system/data}:/lucent:ro
      # Per-mind config files, read-only, for the /settings mind registry.
      # Containerized minds (ada/bob/bilby/nagatha/hex-bot) keep
      # runtime.yaml under hive_mind's minds/; bare-metal Skippy keeps
      # MIND.md under his own repo's minds/. Remote minds (arnold, zach,
      # hex, mordecai if off-host) have no local file here at all.
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/minds:/minds_hive_mind:ro
      - ${SKIPPY_DIR:-/home/daniel/Storage/hive_mind_skippy}/minds:/minds_skippy:ro
      # Same hive_mind minds/ dir, read-write, scoped to voice_ref.wav
      # uploads only (see api_settings_voice_upload) — kept as a second
      # mount rather than loosening the read-only one above, so the
      # blast radius of "settings can write files" stays legible in code.
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/minds:/minds_hive_mind_voice:rw
      # Hive-tools repo, read-only, existence/status check only for the
      # /settings hive-tools card. A missing host path is auto-created
      # empty by compose, which doubles as the "not cloned yet" signal.
      - ${HIVE_TOOLS_DIR:-/home/daniel/Storage/hive-tools}:/hive_tools_repo:ro
      # Hive-init installer assets, read-only, served from the downloads tab.
      - ${HIVE_INIT_DIR:-/home/daniel/Storage/Dev/hive-init}:/hive_init:ro
    networks:
      - hivemind

networks:
  hivemind:
    external: true
    name: hivemind
