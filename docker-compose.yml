services:
  hive:
    build: .
    container_name: hive-site
    restart: unless-stopped
    ports:
      - "8710:8710"
    env_file: .env
    environment:
      - HIVE_HOST=0.0.0.0
      - HIVE_LOG_FORMAT=json
      - HIVE_DB_PATH=/data/hive.db
      - LUCENT_DB_PATH=/lucent/lucent.db
      # Parent domain so the session cookie is shared with the terminal
      # site, which mounts the same auth db and secret.
      - HIVE_COOKIE_DOMAIN=sparktobloom.com
    volumes:
      - ./src:/app/src
      # Auth db — shared with the terminal site.
      - ./data:/data
      # Lucent sqlite, read-only, for the /memory browser. hive_nervous_system
      # retired 2026-07-24 — lucent now lives in hive_mind's own nervous-system/.
      - ${LUCENT_DB_HOST_DIR:-/home/daniel/Storage/Dev/hive_mind/nervous-system/data}:/lucent:ro
      # Per-mind config files for the /settings mind registry and the
      # per-Mind default-model editor. Containerized minds
      # (ada/bob/bilby/nagatha/hex-bot) keep runtime.yaml under hive_mind's
      # minds/. Remote minds (arnold, zach, hex) have no local file here.
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/minds:/minds_hive_mind:ro
      # Edge minds installed on this host keep their own runtime.yaml in
      # their hive-edge-minds checkout. Mounted per mind at its own name so
      # /minds_edge/<name>/runtime.yaml is uniform with the mount above, and
      # read-write because the default-model editor rewrites that one field.
      - ${SKIPPY_DIR:-/home/daniel/Storage/hive-edge-mind-skippy}/minds/skippy:/minds_edge/skippy:rw
      - ${MORDECAI_DIR:-/home/daniel/Storage/hive-edge-mind-mordecai}/minds/mordecai:/minds_edge/mordecai:rw
      # Same hive_mind minds/ dir, read-write, scoped to voice_ref.wav
      # uploads only (see api_settings_voice_upload) — kept as a second
      # mount rather than loosening the read-only one above, so the
      # blast radius of "settings can write files" stays legible in code.
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/minds:/minds_hive_mind_voice:rw
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/minds:/minds_hive_mind_config:rw
      # Hive-tools repo, read-only, existence/status check only for the
      # /settings hive-tools card. A missing host path is auto-created
      # empty by compose, which doubles as the "not cloned yet" signal.
      - ${HIVE_TOOLS_DIR:-/home/daniel/Storage/hive-tools}:/hive_tools_repo:ro
      # Hive-init installer assets, read-only, served from the downloads tab.
      - ${HIVE_INIT_DIR:-/home/daniel/Storage/Dev/hive-init}:/hive_init:ro
      # Fixed destination used by the Capability Nodes one-click clone action.
      - ${INFERENCE_PROXY_DIR:-/home/daniel/Storage/Dev/inference-proxy}:/inference_proxy_repo:rw
      # Shared-secret .env files for the /settings credentials tab. Each is
      # bind-mounted as a single file, read-write, so rotation can write a
      # new value in place — see credentials_data.py for which key lives in
      # which file and why they must move together.
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/nervous-system/.env:/env_nervous_system/.env:rw
      - ${HIVE_MIND_DIR:-/home/daniel/Storage/Dev/hive_mind}/.env:/env_hive_mind/.env:rw
      - ${SKIPPY_DIR:-/home/daniel/Storage/hive-edge-mind-skippy}/.env:/env_edge/skippy/.env:rw
      - ${MORDECAI_DIR:-/home/daniel/Storage/hive-edge-mind-mordecai}/.env:/env_edge/mordecai/.env:rw
      - ${HIVE_TOOLS_DIR:-/home/daniel/Storage/hive-tools}/.env:/env_hive_tools/.env:rw
      # The GitHub PAT's two live homes, for the same tab's paste-to-set flow.
      - ${GIT_CREDENTIALS_FILE:-/home/daniel/.git-credentials}:/gh/.git-credentials:rw
      - ${GH_HOSTS_FILE:-/home/daniel/.config/gh/hosts.yml}:/gh/hosts.yml:rw
    networks:
      - hivemind
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  hivemind:
    external: true
    name: hivemind
