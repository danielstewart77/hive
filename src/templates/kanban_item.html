{% extends "layout.html" %}
{% block title %}{{ item.title }} · Hive{% endblock %}
{% block content %}
<style>
.item-page { max-width: 1100px; margin: 0 auto; display:grid; gap:1rem; }
.item-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:1rem; align-items:start; }
.item-relations { display:grid; gap:.75rem; padding:1rem; }
.item-relations h2 { font-size:1rem; margin:0; }
.item-relations hr { border:0; border-top:1px solid var(--console-line, #333); margin:.25rem 0; }
.relation-row { display:flex; gap:.4rem; align-items:center; min-width:0; }
.relation-row span { min-width:0; overflow-wrap:anywhere; }
.relation-row .button { flex:0 0 auto; padding:.25rem .5rem; font-size:.8rem; min-height:0; }
.relation-row select { min-width:0; max-width:100%; }
@media(max-width:800px){.item-layout{grid-template-columns:minmax(0,1fr)}}
.item-field { display:grid; gap:.4rem; }
.item-field textarea { width:100%; overflow:hidden; resize:none; }
.item-form-header { display:flex; justify-content:flex-end; align-items:center; gap:.75rem; margin-bottom:.25rem; }
.item-title-input { font-size:1.4rem; font-weight:650; padding:.3rem .4rem; width:100%; }
.item-id { margin:0 0 .75rem; color:var(--console-faint,#69747c); font-size:.78rem; font-family:ui-monospace,monospace; user-select:text; overflow-wrap:anywhere; }
.item-actions { display:flex; gap:.5rem; align-items:center; }
.item-feedback { min-height:1.5em; }
.item-back-nav { position:static; background:none; padding:0; min-height:0; z-index:auto; }
.item-back-nav a { color:var(--console-cyan, #4cc9d9); text-decoration:none; font-size:.9rem; }
.item-back-nav a:hover { text-decoration:underline; }
</style>
<main class="page item-page" id="item-page" data-item-id="{{ item.id }}" data-item-kind="{{ item.kind }}" data-item-subtype="{{ item.subtype or '' }}" data-item-status="{{ item.status or '' }}" data-item-number="{{ item.backlog_number }}">
  <nav class="item-back-nav"><a href="/kanban/backlog">Back to backlog</a></nav>
  <p>{{ item.kind | capitalize }}</p>
  <p class="item-number" id="item-number" aria-label="Backlog item number"></p>
  <div class="item-layout">
  <form id="item-form" class="surface item-field">
    <div class="item-actions item-form-header"><select id="status-choice" aria-label="Status" hidden></select><button class="button" type="submit">Save</button><span id="item-feedback" class="item-feedback" role="status" aria-live="polite"></span></div>
    <label class="item-field">Title<input class="item-title-input" type="text" name="title" value="{{ item.title }}" required></label>
    <label class="item-field">Description<textarea name="description">{{ item.description }}</textarea></label>
    <label class="item-field">Requirements<textarea name="requirements">{{ item.requirements }}</textarea></label>
    <label class="item-field">Acceptance criteria<textarea name="acceptance_criteria">{{ item.acceptance_criteria }}</textarea></label>
    <label class="item-field">QA tests<textarea name="qa_tests">{{ item.qa_tests }}</textarea></label>
  </form>
  <aside class="surface item-relations" id="item-relations" aria-label="Parent and children">
    <h2>Type</h2>
    <div class="relation-row"><select id="type-choice" aria-label="Item type"></select></div>
    <hr>
    <h2>Parent</h2>
    <div id="parent-slot"></div>
    <div class="relation-row"><select id="parent-choice" aria-label="Choose a parent"></select></div>
    <hr>
    <h2>Children</h2>
    <div id="children-slot"></div>
    <div class="relation-row"><select id="child-choice" aria-label="Choose a child to add"></select><button class="button" type="button" id="child-add">Add child</button></div>
  </aside>
  </div>
</main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('item-form');
  const feedback = document.getElementById('item-feedback');
  const page = document.getElementById('item-page');
  const kinds = {epic: 'epics', feature: 'features', story: 'stories'};
  const itemId = page.dataset.itemId;
  async function loadBacklogNumber(){
    const response = await fetch('/api/kanban/numbers', {headers: {'Accept': 'application/json'}});
    const numbers = await response.json();
    document.getElementById('item-number').textContent = numbers[itemId] || '';
  }
  const kindName = {epic: 'Epic', feature: 'Feature', story: 'Story'};
  function autoGrow(el){el.style.height='auto';el.style.height=`${el.scrollHeight}px`;}
  const growers = form.querySelectorAll('textarea');
  for (const t of growers) { autoGrow(t); t.addEventListener('input', () => autoGrow(t)); }
  window.addEventListener('resize', () => { for (const t of growers) autoGrow(t); });
  async function loadRelations(){
    const r = await (await fetch(`/api/kanban/relations/${encodeURIComponent(itemId)}`, {headers: {'Accept': 'application/json'}})).json();
    const parentSlot = document.getElementById('parent-slot');
    parentSlot.replaceChildren();
    if (r.parent) {
      const row = document.createElement('div'); row.className = 'relation-row';
      const label = document.createElement('span'); label.textContent = r.parent.title;
      const remove = document.createElement('button'); remove.className = 'button'; remove.type = 'button'; remove.textContent = 'Remove'; remove.setAttribute('aria-label', 'Remove parent');
      remove.addEventListener('click', () => patch({parent: 'none'}, 'Parent removed.'));
      row.append(label, remove); parentSlot.append(row);
    } else {
      const none = document.createElement('p'); none.textContent = 'None (unassigned)'; parentSlot.append(none);
    }
    latestRelations = r;
    fillParentChoices();
    const childChoice = document.getElementById('child-choice');
    childChoice.replaceChildren();
    for (const c of r.addable || []) { const o = document.createElement('option'); o.value = c.id; o.textContent = `${kindName[c.kind || 'story']}: ${c.title}`; o.dataset.kind = c.kind || ''; childChoice.append(o); }
    childChoice.disabled = !(r.addable || []).length;
    document.getElementById('child-add').disabled = !(r.addable || []).length;
    const childrenSlot = document.getElementById('children-slot');
    childrenSlot.replaceChildren();
    if (r.children.length === 0) { const none = document.createElement('p'); none.textContent = 'No children'; childrenSlot.append(none); }
    for (const c of r.children) {
      const row = document.createElement('div'); row.className = 'relation-row';
      const label = document.createElement('span'); label.textContent = c.title;
      const remove = document.createElement('button'); remove.className = 'button'; remove.type = 'button'; remove.textContent = 'Remove'; remove.setAttribute('aria-label', `Remove child ${c.title}`);
      remove.addEventListener('click', () => patchChild(c, {parent: 'none'}, 'Child removed.'));
      row.append(label, remove); childrenSlot.append(row);
    }
  }
  async function patch(body, message){
    const url = `/api/kanban/${kinds[page.dataset.itemKind]}/${encodeURIComponent(itemId)}`;
    const response = await fetch(url, {method: 'PATCH', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
    if (!response.ok) { feedback.textContent = `Not saved: ${(await response.json()).detail || response.status}`; return; }
    feedback.textContent = message; await loadRelations();
  }
  async function patchChild(child, body, message){
    const kind = child.kind || (child.subtype !== undefined ? 'stories' : 'features');
    const url = `/api/kanban/${kind}/${encodeURIComponent(child.id)}`;
    const response = await fetch(url, {method: 'PATCH', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
    if (!response.ok) { feedback.textContent = `Not saved: ${(await response.json()).detail || response.status}`; return; }
    feedback.textContent = message; await loadRelations();
  }
  document.getElementById('child-add').addEventListener('click', () => {
    const choice = document.getElementById('child-choice').value;
    if (!choice) return;
    const kind = page.dataset.itemKind === 'epic' ? (document.querySelector(`#child-choice option[value="${choice}"]`)?.dataset.kind === 'feature' ? 'features' : 'stories') : 'stories';
    const field = page.dataset.itemKind === 'epic' ? 'epic_id' : 'feature_id';
    fetch(`/api/kanban/${kind}/${encodeURIComponent(choice)}`, {method: 'PATCH', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify({[field]: itemId})})
      .then(async r => { feedback.textContent = r.ok ? 'Child added.' : `Not saved: ${(await r.json()).detail || r.status}`; await loadRelations(); });
  });
  function currentType(){return page.dataset.itemKind==='story'&&page.dataset.itemSubtype==='bug'?'bug':page.dataset.itemKind;}
  let latestRelations = {parents_for_type: {}};
  function fillParentChoices(){
    const parentChoice = document.getElementById('parent-choice');
    const options = latestRelations.all || [];
    parentChoice.replaceChildren();
    const none = document.createElement('option'); none.value = ''; none.textContent = 'No parent'; parentChoice.append(none);
    for (const c of options) { if (c.id === itemId) continue; const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.kind ? kindName[c.kind] : 'Item'}: ${c.title}`; o.selected = !!(latestRelations.parent && latestRelations.parent.id === c.id); parentChoice.append(o); }
    parentChoice.disabled = false;
  }
  function fillTypes(){const sel=document.getElementById('type-choice');sel.replaceChildren();const kinds=['epic','feature','story','bug'];for(const k of kinds){const o=document.createElement('option');o.value=k;o.textContent=k.charAt(0).toUpperCase()+k.slice(1);if(k===currentType())o.selected=true;sel.append(o);}sel.onchange=fillParentChoices;}
  const statusLabel = {backlog: 'Backlog', committed: 'Committed', in_progress: 'Work In Progress', done: 'Done'};
  function fillStatus(){
    const sel = document.getElementById('status-choice');
    if (page.dataset.itemKind !== 'story') { sel.hidden = true; return; }
    sel.hidden = false;
    sel.replaceChildren();
    for (const value of Object.keys(statusLabel)) { const o = document.createElement('option'); o.value = value; o.textContent = statusLabel[value]; o.selected = value === page.dataset.itemStatus; sel.append(o); }
  }
  fillTypes();
  fillStatus();
  loadBacklogNumber();
  loadRelations();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const body = Object.fromEntries(new FormData(form).entries());
    const type = document.getElementById('type-choice').value;
    if (type !== currentType()) body.type = type;
    const parent = document.getElementById('parent-choice').value;
    const current = latestRelations.parent ? latestRelations.parent.id : '';
    if (parent !== current) body.parent_id = parent || null;
    if (page.dataset.itemKind === 'story') {
      const status = document.getElementById('status-choice').value;
      if (status !== page.dataset.itemStatus) body.status = status;
    }
    const url = `/api/kanban/${kinds[page.dataset.itemKind]}/${encodeURIComponent(page.dataset.itemId)}`;
    feedback.textContent = 'Saving…';
    try {
      const response = await fetch(url, {method: 'PATCH', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
      if (!response.ok) throw new Error((await response.json()).detail || `Request failed (${response.status})`);
      const updated = await response.json();
      if ('status' in updated) page.dataset.itemStatus = updated.status;
      feedback.textContent = 'Saved.';
    } catch (err) {
      feedback.textContent = `Not saved: ${err.message}`;
    }
  });
})();
</script>
{% endblock %}
