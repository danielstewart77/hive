{% extends "layout.html" %}
{% block title %}Kanban · Hive{% endblock %}
{% block content %}
<style>
.kanban-page { max-width: 1440px; margin: 0 auto; }
.kanban-toolbar { display:flex; gap:.75rem; margin:1rem auto 1.5rem; max-width:760px; justify-content:center; }
.kanban-toolbar a { flex:1; text-align:center; padding:.85rem 1.2rem; border:1px solid var(--console-border, #555); border-radius:12px; text-decoration:none; font-weight:650; background:var(--console-surface, #202020); transition:transform .15s ease, background .15s ease, border-color .15s ease; }
.kanban-toolbar a:hover { transform:translateY(-1px); border-color:var(--console-accent, #c9a84c); }
.kanban-toolbar a.is-active { background:var(--console-accent, #c9a84c); color:#111; border-color:var(--console-accent, #c9a84c); }
@media(max-width:520px){.kanban-toolbar{gap:.5rem}.kanban-toolbar a{padding:.75rem .5rem}}
.kanban-error { color:var(--console-danger, #ef7777); min-height:1.5em; }
.kanban-board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
.kanban-lane { min-height:250px; padding:1rem; }
.kanban-lane h2 { margin-top:0; }
.kanban-drop { min-height:170px; display:flex; flex-direction:column; gap:.65rem; padding:.5rem; border:1px dashed var(--console-border, #555); border-radius:10px; }
.kanban-card { padding:.9rem; cursor:grab; }
.kanban-card:active { cursor:grabbing; }
.kanban-parent { display:block; opacity:.7; font-size:.85rem; margin-top:.4rem; }
.kanban-tree { display:grid; gap:.8rem; }
.kanban-item { padding:1rem; }
.kanban-children { margin: .8rem 0 0 1.2rem; display:grid; gap:.6rem; }
.kanban-inline { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
.kanban-item-title { font-weight:600; margin-right:auto; }
.kanban-empty { opacity:.72; padding:.6rem; }
.kanban-page summary { cursor:pointer; }
.kanban-drag-over { outline:2px dashed var(--console-accent, #c9a84c); }
@media(max-width:800px){.kanban-board{grid-template-columns:1fr}.kanban-lane{min-height:0}.kanban-drop{min-height:110px}}
</style>
<main class="page kanban-page" id="kanban-page">
  <nav class="kanban-toolbar" aria-label="Kanban view">
    <a href="/kanban/backlog" class="{% if view == 'backlog' %}is-active{% endif %}" {% if view == 'backlog' %}aria-current="page"{% endif %}>Backlog</a>
    <a href="/kanban/board" class="{% if view == 'board' %}is-active{% endif %}" {% if view == 'board' %}aria-current="page"{% endif %}>Board</a>
  </nav>
  <p id="kanban-feedback" class="kanban-error" role="status" aria-live="polite">Loading Kanban…</p>
  <section id="board-view" aria-label="Kanban board" {% if view != 'board' %}hidden{% endif %}><div class="kanban-board" id="board-mount"></div></section>
  <section id="backlog-view" aria-label="Kanban backlog" {% if view != 'backlog' %}hidden{% endif %}><div class="kanban-inline" role="group" aria-label="Expand or collapse backlog levels"><button class="button" type="button" id="collapse-level" aria-label="Collapse next level">−</button><button class="button" type="button" id="expand-level" aria-label="Expand next level">+</button></div><div id="backlog-mount" class="kanban-tree"></div></section>
</main>
<script>
(() => {
  'use strict';
  const statuses = [['committed','Committed'],['in_progress','Work In Progress'],['done','Done']];
  const allStatuses = [['backlog','Backlog'], ...statuses];
  const state = {epics:[],features:[],stories:[]};
  const $ = id => document.getElementById(id);
  const feedback = $('kanban-feedback');
  const el = (tag, cls, text) => { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; };
  const button = (label, action) => { const b=el('button','button',label); b.type='button'; b.addEventListener('click',action); return b; };
  async function request(url, method='GET', body) {
    const opts={method,headers:{'Accept':'application/json'}};
    if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    const response=await fetch(url,opts);
    if(!response.ok){let msg=`Request failed (${response.status})`;try{msg=(await response.json()).detail||msg;}catch{}throw new Error(msg);}
    return response.json();
  }
  async function reload(message='') {
    try { const data=await request('/api/kanban/data'); state.epics=data.epics;state.features=data.features;state.stories=data.stories;render();feedback.textContent=message||''; return true; }
    catch(err){feedback.textContent=`Unable to load Kanban: ${err.message}`; return false;}
  }
  const noun=(n,one,many)=>`${n} ${n===1?one:many}`;
  async function confirmDelete(record,kind){
    // Counted by the server, now. This tab's copy of the board is from
    // whenever it last loaded, and agreeing to destroy two stories that are
    // really nine is not a confirmation.
    let counts;
    try{counts=await request(`/api/kanban/${kind}/${encodeURIComponent(record.id)}/descendants`);}
    catch(err){
      // Most often this row is already gone — another tab deleted it. Reload
      // rather than leave a card on screen that no longer exists.
      await reload(`Could not check what this would delete: ${err.message}`);
      return 'failed';
    }
    const beneath=[counts.features&&noun(counts.features,'feature','features'),counts.stories&&noun(counts.stories,'story','stories')].filter(Boolean);
    const warning=beneath.length
      ? `Delete "${record.title}" and the ${beneath.join(' and ')} beneath it? This cannot be undone.`
      : `Delete "${record.title}"? This cannot be undone.`;
    return window.confirm(warning) ? 'yes' : 'no';
  }
  async function removeItem(kind,id){
    try{
      const result=await request(`/api/kanban/${kind}/${encodeURIComponent(id)}`,'DELETE');
      const gone=result&&result.removed;
      const tail=gone&&(gone.features||gone.stories)
        ? ` Also removed ${[gone.features&&noun(gone.features,'feature','features'),gone.stories&&noun(gone.stories,'story','stories')].filter(Boolean).join(' and ')}.`
        : '';
      await reload(`Deleted successfully.${tail}`);
    }catch(err){await reload(`Could not delete: ${err.message}`);}
  }
  function parentOf(story){const f=state.features.find(x=>x.id===story.feature_id);return f?.title||state.epics.find(x=>x.id===story.epic_id)?.title||'Unassigned';}
  function renderBoard(){const mount=$('board-mount');mount.replaceChildren();for(const [status,label] of statuses){const lane=el('section','surface kanban-lane');lane.dataset.status=status;lane.append(el('h2','',label));const drop=el('div','kanban-drop');drop.dataset.status=status;drop.setAttribute('aria-label',`${label} drop zone`);drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',onDrop);const cards=state.stories.filter(s=>s.status===status);if(!cards.length)drop.append(el('p','kanban-empty','Drop a story here'));for(const s of cards){const card=el('article','surface kanban-card');card.draggable=true;card.dataset.id=s.id;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',s.id);e.dataTransfer.effectAllowed='move';});card.append(el('strong','',s.title),el('span','kanban-parent',parentOf(s)));drop.append(card);}lane.append(drop);mount.append(lane);}}
  async function onDrop(e){e.preventDefault();const id=e.dataTransfer.getData('text/plain'), target=e.currentTarget.dataset.status, story=state.stories.find(s=>s.id===id);if(!story||story.status===target)return;if(story._busy)return;story._busy=true;try{const updated=await request(`/api/kanban/stories/${encodeURIComponent(id)}`,'PATCH',{status:target});Object.assign(story,updated);feedback.textContent='Story status updated.';}catch(err){feedback.textContent=`Could not move story: ${err.message}`;await reload(feedback.textContent);}finally{if(story)delete story._busy;render();}}
  function safeTitle(record, kind){const span=el('span','kanban-item-title',record.title);return span;}
  async function mutate(url,method,body,msg){try{await request(url,method,body);await reload(msg);}catch(err){feedback.textContent=`Change not saved: ${err.message}`;}}
  function promptTitle(initial=''){const value=window.prompt('Title',initial);return value===null?null:value.trim();}
  function actionRow(record,kind,parentId){const row=el('div','kanban-inline');row.append(safeTitle(record,kind),button('Rename',async()=>{const title=promptTitle(record.title);if(title)await mutate(`/api/kanban/${kind}/${encodeURIComponent(record.id)}`,'PATCH',{title},`${kind.slice(0,-1)} renamed.`);}));row.append(button('Delete',async(e)=>{const b=e.currentTarget;if(b.disabled)return;b.disabled=true;feedback.textContent='Checking what this would delete…';try{const asked=await confirmDelete(record,kind);if(asked==='yes')await removeItem(kind,record.id);else if(asked==='no')feedback.textContent='';}finally{b.disabled=false;}}));
row.append(button('Details',()=>showDetails(record)));if(kind==='epics')row.append(button('Add feature',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/features','POST',{epic_id:record.id,title},'Feature created.');}));if(kind==='features')row.append(button('Add story',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/stories','POST',{feature_id:record.id,title},'Story created in Backlog.');}));if(kind==='epics')row.append(button('Add story',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/stories','POST',{epic_id:record.id,title},'Story created in Backlog.');}));return row;}
  function renderStory(s){const item=el('div','kanban-item surface');item.append(actionRow(s,'stories'));const select=el('select','');select.setAttribute('aria-label',`Status for ${s.title}`);for(const [value,label] of allStatuses){const option=el('option','',label);option.value=value;option.selected=value===s.status;select.append(option);}select.addEventListener('change',async()=>{const previous=s.status;try{const updated=await request(`/api/kanban/stories/${encodeURIComponent(s.id)}`,'PATCH',{status:select.value});Object.assign(s,updated);render();feedback.textContent='Story status updated.';}catch(err){select.value=previous;feedback.textContent=`Status not saved: ${err.message}`;await reload(feedback.textContent);}});item.append(select);return item;}
  function enableDrop(target,kind,parentId,beforeId){target.addEventListener('dragover',e=>{e.preventDefault();target.classList.add('kanban-drag-over');});target.addEventListener('dragleave',()=>target.classList.remove('kanban-drag-over'));target.addEventListener('drop',async e=>{e.preventDefault();target.classList.remove('kanban-drag-over');let data;try{data=JSON.parse(e.dataTransfer.getData('application/json'));}catch{return;}if(data.kind!==kind||data.id===beforeId)return;const body=kind==='features'?{epic_id:parentId}:{feature_id:parentId};if(beforeId)body.before_id=beforeId;try{await request(`/api/kanban/${kind}/${encodeURIComponent(data.id)}`,'PATCH',body);await reload('Order updated.');}catch(err){await reload(`Move failed: ${err.message}`);}});}
  function makeDraggable(node,kind,id){node.draggable=true;node.addEventListener('dragstart',e=>{e.dataTransfer.setData('application/json',JSON.stringify({kind,id}));e.dataTransfer.effectAllowed='move';});}
  function renderBacklog(){const mount=$('backlog-mount');mount.replaceChildren();const featuresOf=e=>state.features.filter(f=>f.epic_id===e.id);const storiesForFeature=f=>state.stories.filter(s=>s.feature_id===f.id);mount.append(button('Add epic',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/epics','POST',{title},'Epic created.');}));state.epics.forEach((epic,ei)=>{const group=el('details','surface kanban-item');group.open=true;const summary=el('summary','');summary.append(el('span','kanban-item-title',`${ei+1}. ${epic.title}`));group.append(summary,actionRow(epic,'epics'));const children=el('div','kanban-children');const features=featuresOf(epic);features.forEach((feature,fi)=>{const fg=el('details','surface kanban-item');fg.open=true;const fs=storiesForFeature(feature);const head=el('summary','');head.append(el('span','kanban-item-title',`${ei+1}.${fi+1} ${feature.title}`));fg.append(head,actionRow(feature,'features'));makeDraggable(fg,'features',feature.id);enableDrop(fg,'features',epic.id,feature.id);const storyList=el('div','kanban-children');fs.forEach((story,si)=>{const item=renderStory(story);const title=item.querySelector('.kanban-item-title');if(title)title.textContent=`${ei+1}.${fi+1}.${si+1} ${story.title}`;makeDraggable(item,'stories',story.id);enableDrop(item,'stories',feature.id,story.id);storyList.append(item);});if(!fs.length)fg.append(el('p','kanban-empty','No stories in this feature.'));fg.append(storyList);children.append(fg);});const direct=state.stories.filter(s=>s.epic_id===epic.id);direct.forEach((story,si)=>{const item=renderStory(story);const title=item.querySelector('.kanban-item-title');if(title)title.textContent=`${ei+1}.S${si+1} ${story.title}`;children.append(item);});if(!features.length&&!direct.length)children.append(el('p','kanban-empty','No features or stories yet.'));group.append(children);enableDrop(group,'features',epic.id,null);mount.append(group);});if(!state.epics.length)mount.append(el('p','kanban-empty surface','No epics yet. Create one to get started.'));}
  function render(){renderBoard();renderBacklog();}
  function show(which){const board=which==='board';$('board-view').hidden=!board;$('backlog-view').hidden=board;}
  function showDetails(record){const fields=['description','requirements','acceptance_criteria','qa_tests'];const lines=fields.map(f=>`${f}: ${record[f] ?? ''}`);alert(lines.join('\n'));}
  let collapseLevel=0, expandLevel=0;
  function itemLevel(node){const label=node.querySelector(':scope > summary .kanban-item-title')?.textContent||'';return (label.match(/\d+/g)||[]).length;}
  $('collapse-level').addEventListener('click',()=>{const nodes=Array.from($('backlog-mount').querySelectorAll('details'));const level=collapseLevel++%3;const target=[3,2,1][level];nodes.filter(n=>itemLevel(n)===target).forEach(n=>{n.open=false;});});
  $('expand-level').addEventListener('click',()=>{const nodes=Array.from($('backlog-mount').querySelectorAll('details'));const level=expandLevel++%3;const target=[1,2,3][level];nodes.filter(n=>itemLevel(n)===target).forEach(n=>{n.open=true;});});
  const initialView={{ view|tojson }};
  show(initialView);
  reload();
})();
</script>
{% endblock %}
