{% extends "layout.html" %}
{% block title %}Kanban · Hive{% endblock %}
{% block content %}
<style>
.kanban-page { max-width: 1440px; margin: 0 auto; }
.kanban-toolbar {
  /* Pinned: the switcher is how the operator leaves the view they are in, and
     a two-thousand-row backlog puts it a long scroll behind them. Sticky sits
     under the sidebar's own layer so an open menu covers it rather than the
     reverse. */
  position:sticky; top:0; z-index:5;
  display:flex; gap:.75rem; margin:0 0 1.5rem; padding:1rem 0;
  justify-content:center;
  background:var(--console-bg, #111417);
}
/* The band spans the content column so nothing scrolls through it; the two
   buttons keep the width they had when the row itself was centred at 760px. */
.kanban-toolbar a { flex:0 1 370px; max-width:370px; text-align:center; padding:.85rem 1.2rem; border:1px solid var(--console-border, #555); border-radius:12px; text-decoration:none; font-weight:650; background:var(--console-surface, #202020); transition:transform .15s ease, background .15s ease, border-color .15s ease; }
.kanban-toolbar a:hover { transform:translateY(-1px); border-color:var(--console-accent, #c9a84c); }
.kanban-toolbar a.is-active { background:var(--console-accent, #c9a84c); color:#111; border-color:var(--console-accent, #c9a84c); }
@media(max-width:520px){.kanban-toolbar{gap:.5rem}.kanban-toolbar a{padding:.75rem .5rem}}
.kanban-error { color:var(--console-danger, #ef7777); min-height:1.5em; }
.kanban-board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
.kanban-lane { min-height:250px; padding:1rem; }
.kanban-lane h2 { margin-top:0; }
.kanban-drop { min-height:170px; display:flex; flex-direction:column; gap:.65rem; padding:.5rem; border:1px dashed var(--console-border, #555); border-radius:10px; }
.kanban-card { padding:.9rem; cursor:grab; }
.kanban-card:active { cursor:grabbing; }
.kanban-card-done { display:flex; align-items:center; gap:.5rem; }
.kanban-card-text { flex:1 1 auto; min-width:0; display:grid; }
.kanban-card-id { display:block; margin-top:.25rem; opacity:.55; font-size:.72rem; font-family:ui-monospace,monospace; user-select:text; overflow-wrap:anywhere; }
.kanban-trash { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; padding:.3rem; min-height:0; line-height:0; opacity:.75; }
.kanban-trash:hover, .kanban-trash:focus { opacity:1; }
.kanban-parent { display:block; opacity:.7; font-size:.85rem; margin-top:.4rem; }
.kanban-tree { display:grid; gap:.8rem; }
.kanban-item { padding:1rem; }
.kanban-children { margin: .8rem 0 0 1.2rem; display:grid; gap:.6rem; }
.kanban-inline { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; max-width:100%; }
.kanban-inline > * { min-width:0; max-width:100%; }
.kanban-inline .button { flex:0 1 auto; max-width:100%; white-space:normal; overflow-wrap:anywhere; box-sizing:border-box; }
.kanban-inline select { max-width:100%; }
.kanban-item-title { font-weight:600; margin-right:0; margin-left:0; text-align:left; justify-self:start; align-self:center; }
.kanban-empty { opacity:.72; padding:.6rem; }
.kanban-page summary { cursor:pointer; }
.kanban-drag-over { outline:2px dashed var(--console-accent, #c9a84c); }
.kanban-item { position:relative; }
.kanban-drop-band { position:absolute; left:0; right:0; top:-4px; height:8px; border-radius:4px; pointer-events:none; }
.kanban-band-over .kanban-drop-band, .kanban-drop-band.kanban-band-over { background:var(--console-accent, #c9a84c); }
.kanban-nest-over { outline:2px solid var(--console-accent, #c9a84c); outline-offset:2px; }
.kanban-item[data-collapsed="true"] > .kanban-children { display:none; }
.kanban-toggle { display:inline-flex; align-items:center; justify-content:center; flex:0 0 1.5rem; width:1.5rem; min-width:1.5rem; height:1.5rem; padding:0; border:0; background:transparent; color:#77828a; box-shadow:none; transition:color .15s ease; }
.kanban-toggle:hover:not(:disabled) { color:var(--console-cyan,#4cc9d9); background:transparent; }
.kanban-toggle:disabled { opacity:1; color:transparent; }
.kanban-toggle svg { width:15px; height:15px; transition:transform .15s ease; }
.kanban-toggle[aria-expanded="false"] svg { transform:rotate(0deg); }
.kanban-toggle[aria-expanded="true"] svg { transform:rotate(90deg); }
.kanban-item-link { color:inherit; text-decoration:none; }
.kanban-cols { display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:.5rem; width:100%; min-width:0; text-align:left; }
.kanban-col-num { font-variant-numeric:tabular-nums; font-weight:600; min-width:2.6rem; text-align:left; flex:0 0 auto; }


.kanban-row { display:block; }
.kanban-actions { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.35rem; }
.kanban-col-type { font-size:.8rem; opacity:.8; flex:0 0 auto; text-align:left; }

.kanban-col-title { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; font-weight:600; display:block; text-align:left; margin:0; }
.kanban-col-title .kanban-item-title { display:inline; margin:0; text-align:left; flex:0 1 auto; }
.kanban-col-state { font-size:.8rem; opacity:.85; flex:0 0 auto; text-align:left; }
.kanban-dot { color:#3fb950; margin-right:.35rem; font-size:.7rem; }
@media(max-width:520px){.kanban-cols{column-gap:.3rem}.kanban-col-type{display:none}}
.kanban-bug { border:2px solid #e05252 !important; }
.kanban-bug-icon { margin-right:.3rem; }
.kanban-menu { position:fixed; z-index:1000; display:grid; min-width:180px; padding:.3rem; background:var(--console-surface-2, #1d2226); border:1px solid var(--console-line-strong, #4a555e); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.kanban-menu-item { text-align:left; background:none; border:0; color:inherit; font:inherit; padding:.55rem .75rem; border-radius:6px; cursor:pointer; }
.kanban-menu-item:hover, .kanban-menu-item:focus { background:rgba(255,255,255,.08); outline:none; }

.kanban-num { font-variant-numeric:tabular-nums; opacity:.75; font-size:.9rem; flex:0 0 auto; }
.kanban-item > .kanban-inline { flex-wrap:wrap; }
.kanban-row .kanban-inline { min-width:0; }
.kanban-row .kanban-item-title { overflow-wrap:anywhere; margin:0; text-align:left; }
.kanban-tree, .kanban-children, .kanban-item { min-width:0; max-width:100%; box-sizing:border-box; }
@media(max-width:520px){.kanban-children{margin-left:.25rem}.kanban-num{font-size:.8rem}.kanban-inline{gap:.3rem}.kanban-inline .button{padding:.3rem .45rem;font-size:.8rem;min-height:0}.kanban-page{padding-left:.4rem;padding-right:.4rem}.kanban-inline .button{flex:1 1 calc(50% - .3rem)}.kanban-item{padding:.6rem}.kanban-toolbar a{font-size:.9rem}}
@media(max-width:800px){.kanban-board{grid-template-columns:1fr}.kanban-lane{min-height:0}.kanban-drop{min-height:110px}}
</style>
<main class="page kanban-page" id="kanban-page">
  <p id="kanban-feedback" class="kanban-error" role="status" aria-live="polite">Loading Kanban…</p>
  <section id="board-view" aria-label="Kanban board" {% if view != 'board' %}hidden{% endif %}><div class="kanban-board" id="board-mount"></div></section>
  <section id="backlog-view" aria-label="Kanban backlog" {% if view != 'backlog' %}hidden{% endif %}><div class="kanban-inline" role="group" aria-label="Expand or collapse backlog levels"><button class="button" type="button" id="collapse-level" aria-label="Collapse next level">−</button><button class="button" type="button" id="expand-level" aria-label="Expand next level">+</button></div><div id="backlog-mount" class="kanban-tree"></div></section>
</main>
<script>
(() => {
  'use strict';
  const statuses = [['committed','Committed'],['in_progress','Work In Progress'],['done','Done']];
  const allStatuses = [['backlog','Backlog'], ...statuses];
  const state = {epics:[],features:[],stories:[]};
  const $ = id => document.getElementById(id);
  const feedback = $('kanban-feedback');
  const el = (tag, cls, text) => { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; };
  const button = (label, action) => { const b=el('button','button',label); b.type='button'; b.addEventListener('click',action); return b; };
  async function request(url, method='GET', body) {
    const opts={method,headers:{'Accept':'application/json'}};
    if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    const response=await fetch(url,opts);
    if(!response.ok){let msg=`Request failed (${response.status})`;try{msg=(await response.json()).detail||msg;}catch{}throw new Error(msg);}
    return response.json();
  }
  async function reload(message='') {
    try { const data=await request('/api/kanban/data'); state.epics=data.epics;state.features=data.features;state.stories=data.stories;render();feedback.textContent=message||''; return true; }
    catch(err){feedback.textContent=`Unable to load Kanban: ${err.message}`; return false;}
  }
  const noun=(n,one,many)=>`${n} ${n===1?one:many}`;
  async function confirmDelete(record,kind){
    // Counted by the server, now. This tab's copy of the board is from
    // whenever it last loaded, and agreeing to destroy two stories that are
    // really nine is not a confirmation.
    let counts;
    try{counts=await request(`/api/kanban/${kind}/${encodeURIComponent(record.id)}/descendants`);}
    catch(err){
      // Most often this row is already gone — another tab deleted it. Reload
      // rather than leave a card on screen that no longer exists.
      await reload(`Could not check what this would delete: ${err.message}`);
      return 'failed';
    }
    const beneath=[counts.features&&noun(counts.features,'feature','features'),counts.stories&&noun(counts.stories,'story','stories')].filter(Boolean);
    const warning=beneath.length
      ? `Delete "${record.title}" and the ${beneath.join(' and ')} beneath it? This cannot be undone.`
      : `Delete "${record.title}"? This cannot be undone.`;
    return window.confirm(warning) ? 'yes' : 'no';
  }
  async function removeItem(kind,id){
    try{
      const result=await request(`/api/kanban/${kind}/${encodeURIComponent(id)}`,'DELETE');
      const gone=result&&result.removed;
      const tail=gone&&(gone.features||gone.stories)
        ? ` Also removed ${[gone.features&&noun(gone.features,'feature','features'),gone.stories&&noun(gone.stories,'story','stories')].filter(Boolean).join(' and ')}.`
        : '';
      await reload(`Deleted successfully.${tail}`);
    }catch(err){await reload(`Could not delete: ${err.message}`);}
  }
  function parentOf(story){const f=state.features.find(x=>x.id===story.feature_id);return f?.title||state.epics.find(x=>x.id===story.epic_id)?.title||'Unassigned';}
  function trashButton(s){const b=el('button','button kanban-trash');b.type='button';b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';b.setAttribute('aria-label',`Delete ${s.title}`);b.title='Delete';b.draggable=false;b.addEventListener('click',e=>{e.stopPropagation();const del=actionList(s,'stories').find(([label])=>label==='Delete');if(del)del[1]();});return b;}
  function renderBoard(){const mount=$('board-mount');mount.replaceChildren();for(const [status,label] of statuses){const lane=el('section','surface kanban-lane');lane.dataset.status=status;lane.append(el('h2','',label));const drop=el('div','kanban-drop');drop.dataset.status=status;drop.setAttribute('aria-label',`${label} drop zone`);drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',onDrop);const cards=state.stories.filter(s=>s.status===status);if(!cards.length)drop.append(el('p','kanban-empty','Drop a story here'));for(const s of cards){const card=el('article','surface kanban-card');if(s.subtype==='bug')card.classList.add('kanban-bug');card.draggable=true;card.dataset.id=s.id;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',s.id);e.dataTransfer.effectAllowed='move';});const text=el('div','kanban-card-text');const heading=el('strong','');heading.append(safeTitle(s));text.append(heading,el('span','kanban-parent',parentOf(s)),el('span','kanban-card-id',s.id));card.append(text);if(status==='done'){card.classList.add('kanban-card-done');card.append(trashButton(s));}drop.append(card);}lane.append(drop);mount.append(lane);}}
  async function onDrop(e){e.preventDefault();const id=e.dataTransfer.getData('text/plain'), target=e.currentTarget.dataset.status, story=state.stories.find(s=>s.id===id);if(!story||story.status===target)return;if(story._busy)return;story._busy=true;try{const updated=await request(`/api/kanban/stories/${encodeURIComponent(id)}`,'PATCH',{status:target});Object.assign(story,updated);feedback.textContent='Story status updated.';}catch(err){feedback.textContent=`Could not move story: ${err.message}`;await reload(feedback.textContent);}finally{if(story)delete story._busy;render();}}
  function safeTitle(record){const a=el('a','kanban-item-title',record.title);a.href=`/kanban/item/${encodeURIComponent(record.id)}`;a.draggable=false;return a;}
  async function mutate(url,method,body,msg){try{await request(url,method,body);await reload(msg);}catch(err){feedback.textContent=`Change not saved: ${err.message}`;}}
  function promptTitle(initial=''){const value=window.prompt('Title',initial);return value===null?null:value.trim();}
  function actionList(record,kind){
    const deleteRecord=async()=>{if(deleteRecord.busy)return;deleteRecord.busy=true;feedback.textContent='Checking what this would delete…';try{const asked=await confirmDelete(record,kind);if(asked==='yes')await removeItem(kind,record.id);else if(asked==='no')feedback.textContent='';}finally{deleteRecord.busy=false;}};
    const list=[
      ['Rename',async()=>{const title=promptTitle(record.title);if(title)await mutate(`/api/kanban/${kind}/${encodeURIComponent(record.id)}`,'PATCH',{title},`${kind.slice(0,-1)} renamed.`);}],
      ['Delete',deleteRecord],
      ['Details',()=>showDetails(record)],
    ];
    if(kind==='epics')list.push(['Add feature',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/features','POST',{epic_id:record.id,title},'Feature created.');}]);
    if(kind==='features')list.push(['Add story',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/stories','POST',{feature_id:record.id,title},'Story created in Backlog.');}]);
    if(kind==='epics')list.push(['Add story',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/stories','POST',{epic_id:record.id,title},'Story created in Backlog.');}]);
    const current=kind==='stories'?'story':kind.slice(0,-1);
    for(const t of ['epic','feature','story'].filter(t=>t!==current)){if(kind==='epics'&&t==='epic')continue;list.push([`Change to ${t}`,()=>mutate(`/api/kanban/${kind}/${encodeURIComponent(record.id)}`,'PATCH',{type:t},`Changed to ${t}.`)]);}
    return list;
  }
  function markBug(node,story){if(story.subtype!=='bug')return;node.classList.add('kanban-bug');const title=node.querySelector('.kanban-item-title');if(title&&!title.querySelector('.kanban-bug-icon')){const icon=el('span','kanban-bug-icon','🐞');icon.setAttribute('aria-label','Bug');title.prepend(icon);}}
  let openMenu=null;
  function closeMenu(){if(openMenu){openMenu.remove();openMenu=null;}}
  function showMenu(x,y,list){closeMenu();const menu=el('div','kanban-menu');menu.setAttribute('role','menu');for(const [label,action] of list){const item=el('button','kanban-menu-item',label);item.type='button';item.setAttribute('role','menuitem');item.addEventListener('click',async()=>{closeMenu();await action();});menu.append(item);}document.body.append(menu);const maxLeft=window.innerWidth-menu.offsetWidth-8;const maxTop=window.innerHeight-menu.offsetHeight-8;menu.style.left=`${Math.max(8,Math.min(x,maxLeft))}px`;menu.style.top=`${Math.max(8,Math.min(y,maxTop))}px`;openMenu=menu;}
  document.addEventListener('click',e=>{if(openMenu&&!openMenu.contains(e.target))closeMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
  window.addEventListener('scroll',closeMenu,true);
  function actionRow(record,kind){
    const list=actionList(record,kind);
    const row=el('div','kanban-inline');
    row.append(safeTitle(record));
    for(const [label,action] of list)row.append(button(label,action));
    row.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(e.clientX,e.clientY,list);});
    return row;
  }
  function renderStory(s){const item=el('div','kanban-item surface');item.append(actionRow(s,'stories'));const select=el('select','');select.setAttribute('aria-label',`Status for ${s.title}`);for(const [value,label] of allStatuses){const option=el('option','',label);option.value=value;option.selected=value===s.status;select.append(option);}select.addEventListener('change',async()=>{const previous=s.status;try{const updated=await request(`/api/kanban/stories/${encodeURIComponent(s.id)}`,'PATCH',{status:select.value});Object.assign(s,updated);render();feedback.textContent='Story status updated.';}catch(err){select.value=previous;feedback.textContent=`Status not saved: ${err.message}`;await reload(feedback.textContent);}});item.append(select);return item;}
  // Two drop zones on every row. The top band of a row is a reorder: a vertical line shows
  // where the item will land, and the dropped item takes the row's parent. The rest of the
  // row is a nest: a border shows the row will become the dropped item's parent.
  function enableDrop(target,kind,parentId,beforeId){
    const band=el('div','kanban-drop-band');band.setAttribute('aria-hidden','true');
    if(beforeId)target.prepend(band);
    const clearMarks=()=>{target.classList.remove('kanban-nest-over');band.classList.remove('kanban-band-over');};
    const zoneOf=e=>{if(!beforeId)return 'nest';const r=target.getBoundingClientRect();return (e.clientY-r.top)<Math.min(14,r.height/3)?'reorder':'nest';};
    target.addEventListener('dragover',e=>{
      e.preventDefault();
      const zone=zoneOf(e);
      target.classList.toggle('kanban-nest-over',zone==='nest');
      band.classList.toggle('kanban-band-over',zone==='reorder');
    });
    target.addEventListener('dragleave',e=>{if(!target.contains(e.relatedTarget))clearMarks();});
    target.addEventListener('drop',async e=>{
      e.preventDefault();e.stopPropagation();const zone=zoneOf(e);clearMarks();
      let data;try{data=JSON.parse(e.dataTransfer.getData('text/plain'));}catch{return;}
      if(!data||!data.id)return;
      let url,body;
      if(zone==='reorder'&&beforeId){
        if(data.id===beforeId)return;
        url=`/api/kanban/${data.kind}/${encodeURIComponent(data.id)}`;body={before_id:beforeId};
      }else{
        if(data.id===target.dataset.id)return;
        url=`/api/kanban/${data.kind}/${encodeURIComponent(data.id)}`;body={parent_id:target.dataset.id||null};
      }
      try{await request(url,'PATCH',body);await reload(zone==='reorder'?'Moved.':'Nested.');}
      catch(err){await reload(`Move failed: ${err.message}`);}
    });
  }
  function makeDraggable(node,kind,id){node.draggable=true;node.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('button,select,textarea,input')&&e.target!==node)return;e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({kind,id}));e.dataTransfer.effectAllowed='move';});}
  const EXPANDED_KEY='kanban-expanded-items';
  function loadExpanded(){try{return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY)||'[]'));}catch{return new Set();}}
  function saveExpanded(set){try{localStorage.setItem(EXPANDED_KEY,JSON.stringify([...set]));}catch{}}
  let expandedIds=loadExpanded();
  function rememberState(node,id){if(!id)return;const on=node.dataset.collapsed!=='true';if(on)expandedIds.add(id);else expandedIds.delete(id);saveExpanded(expandedIds);}
  function makeToggle(node,hasChildren){const t=el('button','button kanban-toggle');t.type='button';t.disabled=!hasChildren;t.setAttribute('aria-label','Expand or collapse');t.setAttribute('aria-expanded',String(node.dataset.collapsed!=='true'));const icon=el('i','');icon.setAttribute('data-lucide','chevron-right');t.append(icon);t.addEventListener('click',e=>{e.stopPropagation();setCollapsed(node,node.dataset.collapsed!=='true');rememberState(node,node.dataset.itemId);});return t;}
  function setCollapsed(node,on){node.dataset.collapsed=String(on);const t=node.querySelector(':scope > .kanban-inline .kanban-toggle');if(t&&!t.disabled)t.setAttribute('aria-expanded',String(!on));}
  function labelRow(node,row,label,hasChildren,id,meta){
    node.dataset.itemId=id||'';
    if(id&&hasChildren){setCollapsed(node,!expandedIds.has(id));}else if(hasChildren){setCollapsed(node,true);}
    const name=label;
    const title=row.querySelector('.kanban-item-title');
    const actions=Array.from(row.children).filter(c=>c!==title);
    const cols=el('div','kanban-cols');
    cols.append(makeToggle(node,hasChildren));
    cols.append(el('span','kanban-col-type',meta.type));
    const t=el('span','kanban-col-title');
    if(meta.inProgress)t.append(el('span','kanban-dot','●'));
    title.textContent=name;t.append(title);cols.append(t);
    cols.append(el('span','kanban-col-state',meta.state||''));
    row.replaceChildren(cols);
    row.classList.add('kanban-row');
    return row;
  }
  function renderBacklog(){
    const mount=$('backlog-mount');mount.replaceChildren();
    mount.append(button('Add epic',async()=>{const title=promptTitle();if(title)await mutate('/api/kanban/epics','POST',{title},'Epic created.');}));
    const all=[...state.epics.map(e=>({...e,_kind:'epics'})),...state.features.map(f=>({...f,_kind:'features'})),...state.stories.map(s=>({...s,_kind:'stories'}))];
    const parentOf=r=>r.parent_id||r.feature_id||r.epic_id||null;
    const childrenOf=id=>all.filter(r=>parentOf(r)===id);
    const roots=all.filter(r=>!parentOf(r)||!all.some(p=>p.id===parentOf(r)));
    const kindLabel=r=>r._kind==='epics'?'Epic':r._kind==='features'?'Feature':(r.subtype==='bug'?'Bug':'Story');
    const build=(r,level,number)=>{
      const kids=childrenOf(r.id);
      const node=el('div','surface kanban-item');node.dataset.level=String(level);node.dataset.id=r.id;
      const label=`${number} ${r.title}`;
      const sub=kids.length>0;
      if(r._kind==='stories'){
        const item=renderStory(r);item.dataset.level=String(level);item.dataset.id=r.id;
        labelRow(item,item.querySelector(':scope > .kanban-inline'),label,false,r.id,{type:kindLabel(r),number,state:r.status,inProgress:r.status==='in_progress'});
        markBug(item,r);makeDraggable(item,'stories',r.id);enableDrop(item,'stories',parentOf(r),r.id);
        return item;
      }
      node.append(labelRow(node,actionRow(r,r._kind),label,sub,r.id,{type:kindLabel(r),number,state:'',inProgress:false}));
      makeDraggable(node,r._kind,r.id);
      enableDrop(node,r._kind,r.parent_id||r.epic_id||null,r.id);
      const children=el('div','kanban-children');
      kids.forEach((k,ki)=>children.append(build(k,level+1,`${number}.${ki+1}`)));
      if(!sub)children.append(el('p','kanban-empty','Nothing under this yet.'));
      node.append(children);
      return node;
    };
    roots.forEach((r,ri)=>mount.append(build(r,1,`${ri+1}`)));
    if(!roots.length)mount.append(el('p','kanban-empty surface','No epics yet. Create one to get started.'));
    if(window.lucide)window.lucide.createIcons({attrs:{'stroke-width':1.8}});
  }
  function render(){renderBoard();renderBacklog();}
  function show(which){const board=which==='board';$('board-view').hidden=!board;$('backlog-view').hidden=board;}
  function showDetails(record){const fields=['description','requirements','acceptance_criteria','qa_tests'];const lines=fields.map(f=>`${f}: ${record[f] ?? ''}`);alert(lines.join('\n'));}
  let collapseLevel=0, expandLevel=0;
  $('collapse-level').addEventListener('click',()=>{const nodes=Array.from($('backlog-mount').querySelectorAll('.kanban-item[data-level]'));const level=collapseLevel++%3;const target=[3,2,1][level];nodes.filter(n=>Number(n.dataset.level)===target).forEach(n=>{setCollapsed(n,true);rememberState(n,n.dataset.itemId);});});
  $('expand-level').addEventListener('click',()=>{const nodes=Array.from($('backlog-mount').querySelectorAll('.kanban-item[data-level]'));const level=expandLevel++%3;const target=[1,2,3][level];nodes.filter(n=>Number(n.dataset.level)===target).forEach(n=>{setCollapsed(n,false);rememberState(n,n.dataset.itemId);});});
  const initialView={{ view|tojson }};
  show(initialView);
  reload();
})();
</script>
{% endblock %}
