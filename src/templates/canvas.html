{% extends "layout.html" %}
{% block content %}
<style>
  /* Full-bleed canvas page */
  .content-wrapper { padding: 0 !important; }
  .content-wrapper > .terminal-box,
  .content-wrapper > footer { display: none; }

  /* Full-screen whiteboard */
  .draw-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--nav-h));
    overflow: hidden;
    background: #090912;
    user-select: none;
  }

  /* Toolbar */
  .draw-toolbar {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0 0.85rem;
    height: 40px;
    border-bottom: 1px solid #c9a84c22;
    background: #0a0a16;
    flex-shrink: 0;
  }

  .draw-tool {
    font-family: 'Fira Code', monospace;
    font-size: 0.72rem;
    padding: 0.18rem 0.55rem;
    background: transparent;
    border: 1px solid #c9a84c33;
    color: #c9a84c77;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
    line-height: 1.6;
  }
  .draw-tool:hover {
    color: #c9a84c;
    border-color: #c9a84c66;
    background: #c9a84c0d;
  }
  .draw-tool.active {
    color: #f1d78a;
    border-color: #c9a84c;
    background: #c9a84c1f;
  }

  .draw-tool-send {
    color: #2dd4bf;
    border-color: #2dd4bf55;
  }
  .draw-tool-send:hover {
    color: #5eead4;
    border-color: #2dd4bf;
    background: #2dd4bf14;
  }
  .draw-tool-send:disabled { opacity: 0.5; cursor: default; }

  .draw-btn-fit {
    font-family: 'Fira Code', monospace;
    font-size: 0.72rem;
    padding: 0.18rem 0.55rem;
    background: transparent;
    border: 1px solid #c9a84c33;
    color: #c9a84c77;
    border-radius: 3px;
    cursor: pointer;
    line-height: 1.6;
  }
  .draw-btn-fit:hover { color: #c9a84c; border-color: #c9a84c66; background: #c9a84c0d; }

  .draw-spacer { flex: 1; }

  .draw-btn-clear {
    font-family: 'Fira Code', monospace;
    font-size: 0.72rem;
    padding: 0.18rem 0.55rem;
    background: transparent;
    border: 1px solid #7a1a1a44;
    color: #c0404066;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
    line-height: 1.6;
  }
  .draw-btn-clear:hover {
    color: #c04040;
    border-color: #7a1a1a;
    background: #7a1a1a11;
  }

  /* Slide navigation */
  .draw-nav {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-right: 0.4rem;
  }
  .draw-nav-arrow {
    font-family: 'Fira Code', monospace;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0.22rem 0.5rem;
    background: transparent;
    border: 1px solid #c9a84c33;
    color: #c9a84c99;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .draw-nav-arrow:hover:not(:disabled) {
    color: #f1d78a;
    border-color: #c9a84c;
    background: #c9a84c1f;
  }
  .draw-nav-arrow:disabled { opacity: 0.3; cursor: default; }
  .draw-nav-count {
    font-family: 'Fira Code', monospace;
    font-size: 0.72rem;
    color: #c9a84c88;
    min-width: 6.5rem;
    text-align: center;
    user-select: none;
  }

  .draw-conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #333;
    margin-left: 0.2rem;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .draw-conn-dot.connected { background: #22c55e; }
  .draw-conn-dot.readonly  { background: #38bdf8; }

  /* Canvas surface */
  .draw-surface {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    touch-action: none;
  }
  .draw-surface.tool-select { cursor: default; }
  .draw-surface.tool-text   { cursor: text; }

  #draw-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* Zoomed far enough out that authored stroke widths fall below a device
     pixel, which reads as a drawing with lines missing rather than a small
     one. Hold the nominal widths in screen space instead. */
  #draw-svg.hairline path,
  #draw-svg.hairline #selection-rect { vector-effect: non-scaling-stroke; }

  /* Phone: the toolbar is wider than the screen, and a row that cannot wrap
     pushes the fit and send buttons off the edge where nothing can reach. */
  @media (max-width: 660px) {
    .draw-toolbar { height: auto; flex-wrap: wrap; gap: 0.3rem; padding: 0.3rem 0.5rem; }
    .draw-spacer { flex: 0 0 auto; }
    .draw-nav-count { min-width: 4.8rem; }
    .draw-tool, .draw-btn-fit, .draw-btn-clear { font-size: 0.68rem; padding: 0.16rem 0.4rem; }
  }

  /* Floating text input when placing a text box */
  .canvas-textbox-input {
    position: absolute;
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    background: transparent;
    border: none;
    border-bottom: 1px dashed;
    outline: none;
    padding: 0 2px;
    min-width: 100px;
    white-space: pre;
    z-index: 10;
    line-height: 1.4;
  }

  /* Selection ring drawn as SVG rect */
  #selection-rect {
    fill: none;
    stroke: #c9a84c;
    stroke-width: 1;
    stroke-dasharray: 4 3;
    pointer-events: none;
    display: none;
  }
</style>

<div class="draw-container" id="draw-container">
  <div class="draw-toolbar">
    <button class="draw-tool active" data-tool="pen" title="Pen — freehand draw">&#9998; pen</button>
    <button class="draw-tool" data-tool="text" title="Text — click to place">T text</button>
    <button class="draw-tool" data-tool="select" title="Select — click to pick, Delete to remove, drag to move">&#8598; select</button>
    <button class="draw-tool" data-tool="attach" title="Attach an image file">&#8853; attach</button>
    <input type="file" id="file-input" style="display:none" accept="image/*">
    <span class="draw-spacer"></span>
    {% if current_user %}
    <div class="draw-nav">
      <button class="draw-nav-arrow" id="slide-prev" title="Previous slide">&#9664;</button>
      <span class="draw-nav-count" id="slide-count">slide 1 of 1</span>
      <button class="draw-nav-arrow" id="slide-next" title="Next slide">&#9654;</button>
    </div>
    {% endif %}
    <button class="draw-btn-fit" id="draw-fit" title="Fit this slide to the screen">&#9635; fit</button>
    <button class="draw-tool draw-tool-send" id="draw-submit" title="Send the board to Skippy for review">&#9993; send to Skippy</button>
    <button class="draw-btn-clear" id="draw-clear">clear</button>
    <span class="draw-conn-dot" id="draw-conn" title="disconnected"></span>
  </div>

  <div class="draw-surface" id="draw-surface">
    <svg id="draw-svg" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
      <g id="draw-elements"></g>
      <rect id="selection-rect" x="0" y="0" width="0" height="0"/>
      <g id="draw-live"></g>
    </svg>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Identity ──────────────────────────────────────────────────────────────
  const CAN_DRAW = {{ "true" if current_user else "false" }};
  const MY_COLOR = CAN_DRAW ? '#c9a84c' : '#2dd4bf';

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const surface    = document.getElementById('draw-surface');
  const svg        = document.getElementById('draw-svg');
  const elGroup    = document.getElementById('draw-elements');
  const liveGroup  = document.getElementById('draw-live');
  const selRect    = document.getElementById('selection-rect');
  const connDot    = document.getElementById('draw-conn');
  const fileInput  = document.getElementById('file-input');
  const navPrev    = document.getElementById('slide-prev');
  const navNext    = document.getElementById('slide-next');
  const navCount   = document.getElementById('slide-count');

  // ── State ─────────────────────────────────────────────────────────────────
  let tool       = 'pen';
  let ws         = null;
  let wsReady    = false;
  let elementMap = new Map(); // id → { svgEl, data }
  let selectedId = null;
  let currentSlide = 1;

  // Pen state
  let drawing    = false;
  let livePath   = null;
  let livePoints = [];
  let livePid    = null;

  // Drag-to-move state (select tool)
  let dragId         = null;
  let dragStartX     = 0, dragStartY = 0;
  let dragElStartX   = 0, dragElStartY = 0;
  let didDrag        = false;

  // ── Utilities ─────────────────────────────────────────────────────────────
  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  // The board is authored in a fixed pixel space and the SVG now carries a
  // viewBox, so client pixels and board units are no longer the same thing.
  // Every pointer position has to come back through the screen CTM or a
  // stroke lands somewhere the user did not touch.
  function svgPt(e) {
    const m = svg.getScreenCTM();
    if (!m) {
      const r = svg.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const u = p.matrixTransform(m.inverse());
    return { x: u.x, y: u.y };
  }

  function userToClient(pt) {
    const m = svg.getScreenCTM();
    if (!m) return { x: pt.x, y: pt.y };
    const p = svg.createSVGPoint();
    p.x = pt.x; p.y = pt.y;
    const c = p.matrixTransform(m);
    return { x: c.x, y: c.y };
  }

  // ── View box ──────────────────────────────────────────────────────────────
  // Without one the SVG renders the board 1:1, so a phone shows the top-left
  // corner of it and no gesture reaches the rest.
  const BOARD = { x: 0, y: 0, w: 1600, h: 900 };
  let view = Object.assign({}, BOARD);
  let viewPinned = false;       // the user has zoomed or panned by hand
  let fitTimer = null;

  function applyView() {
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    const r = svg.getBoundingClientRect();
    svg.classList.toggle('hairline', r.width > 0 && r.width / view.w < 0.55);
  }

  function contentBox() {
    let b = null;
    elementMap.forEach(entry => {
      if (slideOf(entry.data) !== currentSlide) return;
      let x;
      try { x = entry.svgEl.getBBox(); } catch (err) { return; }
      if (!x || (!x.width && !x.height)) return;
      b = b ? {
        x0: Math.min(b.x0, x.x), y0: Math.min(b.y0, x.y),
        x1: Math.max(b.x1, x.x + x.width), y1: Math.max(b.y1, x.y + x.height)
      } : { x0: x.x, y0: x.y, x1: x.x + x.width, y1: x.y + x.height };
    });
    return b;
  }

  function fitView(force) {
    if (drawing) return;
    if (viewPinned && !force) return;
    viewPinned = false;
    const b = contentBox();
    if (!b) { view = Object.assign({}, BOARD); applyView(); return; }
    const w = Math.max(b.x1 - b.x0, 40), h = Math.max(b.y1 - b.y0, 40);
    const px = w * 0.03 + 12, py = h * 0.03 + 12;
    view = { x: b.x0 - px, y: b.y0 - py, w: w + px * 2, h: h + py * 2 };
    const r = svg.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      const va = r.width / r.height;
      if (view.w / view.h < va) {
        const nw = view.h * va; view.x -= (nw - view.w) / 2; view.w = nw;
      } else {
        const nh = view.w / va; view.y -= (nh - view.h) / 2; view.h = nh;
      }
    }
    applyView();
  }

  function scheduleFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => fitView(false), 180);
  }

  function zoomBy(clientX, clientY, factor) {
    const before = svgPt({ clientX, clientY });
    const nw = Math.min(BOARD.w * 60, Math.max(30, view.w * factor));
    view.h *= nw / view.w;
    view.w = nw;
    applyView();
    const after = svgPt({ clientX, clientY });
    view.x += before.x - after.x;
    view.y += before.y - after.y;
    viewPinned = true;
    applyView();
  }

  function touchSvgPt(e) {
    const t = e.touches[0] || e.changedTouches[0];
    return svgPt(t);
  }

  function smoothD(pts) {
    if (!pts.length) return '';
    if (pts.length === 1) return `M${pts[0].x},${pts[0].y}`;
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      d += ` Q${pts[i].x},${pts[i].y} ${mx},${my}`;
    }
    const l = pts[pts.length - 1];
    d += ` L${l.x},${l.y}`;
    return d;
  }

  // ── Slides ────────────────────────────────────────────────────────────────
  // Every element carries a slide number; the board shows one slide at a time.
  // Content that predates slides has none, and reads as slide one.
  function slideOf(data) {
    const n = parseInt(data && data.slide, 10);
    return (isFinite(n) && n >= 1) ? n : 1;
  }

  function slideCount() {
    let max = 1;
    elementMap.forEach(entry => {
      const n = slideOf(entry.data);
      if (n > max) max = n;
    });
    return max;
  }

  function applyVisibility(entry) {
    entry.svgEl.style.display = (slideOf(entry.data) === currentSlide) ? '' : 'none';
  }

  function refreshDeck() {
    const total = slideCount();
    if (currentSlide > total) currentSlide = total;
    if (currentSlide < 1) currentSlide = 1;
    elementMap.forEach(applyVisibility);
    if (navCount) navCount.textContent = `slide ${currentSlide} of ${total}`;
    if (navPrev) navPrev.disabled = currentSlide <= 1;
    if (navNext) navNext.disabled = currentSlide >= total;
    scheduleFit();
  }

  function clearSlideLocally(n) {
    const doomed = [];
    elementMap.forEach((entry, id) => {
      if (slideOf(entry.data) === n) doomed.push(id);
    });
    doomed.forEach(applyDelete);
  }

  function goSlide(n) {
    const total = slideCount();
    const target = Math.min(Math.max(n, 1), total);
    if (target === currentSlide) { refreshDeck(); return; }
    currentSlide = target;
    clearSelection();
    refreshDeck();
    fitView(true);
  }

  if (navPrev) navPrev.addEventListener('click', () => goSlide(currentSlide - 1));
  if (navNext) navNext.addEventListener('click', () => goSlide(currentSlide + 1));

  // ── Tool selection ────────────────────────────────────────────────────────
  document.querySelectorAll('.draw-tool').forEach(btn => {
    btn.addEventListener('click', function () {
      const t = this.dataset.tool;
      if (!t) return;            // send, fit: on the row, not tools
      if (!CAN_DRAW && t !== 'select') return;
      if (t === 'attach') {
        fileInput.click();
        return;
      }
      setTool(t);
    });
  });

  function setTool(t) {
    tool = t;
    document.querySelectorAll('.draw-tool').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === t)
    );
    surface.className = 'draw-surface'
      + (t === 'select' ? ' tool-select' : t === 'text' ? ' tool-text' : '');
    clearSelection();
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────
  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/canvas`);

    ws.onopen = () => {
      wsReady = true;
      connDot.className = 'draw-conn-dot ' + (CAN_DRAW ? 'connected' : 'readonly');
      connDot.title = CAN_DRAW ? 'connected' : 'read-only';
    };

    ws.onclose = () => {
      wsReady = false;
      connDot.className = 'draw-conn-dot';
      connDot.title = 'disconnected';
      setTimeout(connectWs, 3000);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = e => handleServerMsg(JSON.parse(e.data));
  }

  function send(obj) {
    if (wsReady && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  // ── Apply server messages ─────────────────────────────────────────────────
  function handleServerMsg(msg) {
    switch (msg.type) {
      case 'state':
        elGroup.innerHTML = '';
        elementMap.clear();
        clearSelection();
        (msg.elements || []).forEach(applyElement);
        refreshDeck();
        break;
      case 'path':  applyElement(msg); refreshDeck(); break;
      case 'text':  applyElement(msg); refreshDeck(); break;
      case 'image': applyElement(msg); refreshDeck(); break;
      case 'move':  applyMove(msg); break;
      case 'delete': applyDelete(msg.id); refreshDeck(); break;
      case 'clear':
        if (msg.slide !== undefined && msg.slide !== null) {
          clearSlideLocally(slideOf(msg));
        } else {
          elGroup.innerHTML = '';
          elementMap.clear();
          clearSelection();
        }
        refreshDeck();
        break;
    }
  }

  function applyElement(data) {
    if (elementMap.has(data.id)) return;
    switch (data.type) {
      case 'path':  addPathEl(data); break;
      case 'text':  addTextEl(data); break;
      case 'image': addImageEl(data); break;
    }
  }

  // ── SVG element builders ──────────────────────────────────────────────────
  function addPathEl(data) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('d', data.d || '');
    el.setAttribute('stroke', data.color || '#c9a84c');
    el.setAttribute('stroke-width', data.sw || 2);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('data-id', data.id);
    el.style.pointerEvents = 'stroke';
    elGroup.appendChild(el);
    elementMap.set(data.id, { svgEl: el, data: Object.assign({}, data) });
    applyVisibility(elementMap.get(data.id));
    if (CAN_DRAW) el.addEventListener('click', e => { e.stopPropagation(); onElemClick(data.id); });
  }

  function addTextEl(data) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    el.setAttribute('x', data.x);
    el.setAttribute('y', data.y);
    el.setAttribute('fill', data.color || '#c9a84c');
    el.setAttribute('font-family', "'Fira Code', monospace");
    el.setAttribute('font-size', data.size || 14);
    el.setAttribute('data-id', data.id);
    el.style.cursor = CAN_DRAW ? 'default' : 'default';
    el.textContent = data.content || '';
    elGroup.appendChild(el);
    const stored = Object.assign({}, data);
    elementMap.set(data.id, { svgEl: el, data: stored });
    applyVisibility(elementMap.get(data.id));
    if (CAN_DRAW) {
      el.addEventListener('click', e => { e.stopPropagation(); onElemClick(data.id); });
      el.addEventListener('mousedown', e => onElemMouseDown(e, data.id));
    }
  }

  function addImageEl(data) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${data.x},${data.y})`);
    g.setAttribute('data-id', data.id);

    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('width', data.w || 200);
    img.setAttribute('height', data.h || 150);
    img.setAttribute('href', data.src || '');
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    g.appendChild(img);
    elGroup.appendChild(g);
    const stored = Object.assign({}, data);
    elementMap.set(data.id, { svgEl: g, data: stored });
    applyVisibility(elementMap.get(data.id));
    if (CAN_DRAW) {
      g.addEventListener('click', e => { e.stopPropagation(); onElemClick(data.id); });
      g.addEventListener('mousedown', e => onElemMouseDown(e, data.id));
    }
  }

  function applyMove(msg) {
    const entry = elementMap.get(msg.id);
    if (!entry) return;
    const { svgEl, data } = entry;
    data.x = msg.x; data.y = msg.y;
    if (data.type === 'text') {
      svgEl.setAttribute('x', msg.x);
      svgEl.setAttribute('y', msg.y);
    } else if (data.type === 'image') {
      svgEl.setAttribute('transform', `translate(${msg.x},${msg.y})`);
    }
    if (selectedId === msg.id) updateSelectionRect(msg.id);
  }

  function applyDelete(id) {
    const entry = elementMap.get(id);
    if (!entry) return;
    entry.svgEl.remove();
    elementMap.delete(id);
    if (selectedId === id) clearSelection();
  }

  // ── Selection ─────────────────────────────────────────────────────────────
  function onElemClick(id) {
    if (tool !== 'select') return;
    selectElement(id);
  }

  function selectElement(id) {
    clearSelection();
    selectedId = id;
    updateSelectionRect(id);
  }

  function updateSelectionRect(id) {
    const entry = elementMap.get(id);
    if (!entry) return;
    try {
      const bbox = entry.svgEl.getBBox();
      const pad = 4;
      selRect.setAttribute('x', bbox.x - pad);
      selRect.setAttribute('y', bbox.y - pad);
      selRect.setAttribute('width', bbox.width + pad * 2);
      selRect.setAttribute('height', bbox.height + pad * 2);
      selRect.style.display = '';
    } catch (e) {
      selRect.style.display = 'none';
    }
  }

  function clearSelection() {
    selectedId = null;
    selRect.style.display = 'none';
  }

  // ── Drag to move (select tool) ────────────────────────────────────────────
  function onElemMouseDown(e, id) {
    if (tool !== 'select') return;
    e.stopPropagation();
    selectElement(id);
    dragId       = id;
    dragStartX   = e.clientX;
    dragStartY   = e.clientY;
    didDrag      = false;
    const { data } = elementMap.get(id);
    dragElStartX = data.x || 0;
    dragElStartY = data.y || 0;
  }

  svg.addEventListener('mousemove', e => {
    if (!dragId) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) didDrag = true;
    const entry = elementMap.get(dragId);
    if (!entry) { dragId = null; return; }
    const nx = dragElStartX + dx;
    const ny = dragElStartY + dy;
    const { svgEl, data } = entry;
    if (data.type === 'text') {
      svgEl.setAttribute('x', nx);
      svgEl.setAttribute('y', ny);
    } else if (data.type === 'image') {
      svgEl.setAttribute('transform', `translate(${nx},${ny})`);
    }
    updateSelectionRect(dragId);
  });

  window.addEventListener('mouseup', e => {
    if (!dragId) return;
    if (didDrag) {
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const entry = elementMap.get(dragId);
      if (entry) {
        const nx = dragElStartX + dx;
        const ny = dragElStartY + dy;
        entry.data.x = nx; entry.data.y = ny;
        send({ type: 'move', id: dragId, x: nx, y: ny });
      }
    }
    dragId = null;
    didDrag = false;
  });

  // ── Delete key ────────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (!CAN_DRAW || !selectedId) return;
    if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      const id = selectedId;
      applyDelete(id);
      send({ type: 'delete', id });
      refreshDeck();
    }
  });

  // ── Pen tool ──────────────────────────────────────────────────────────────
  function penDown(pt) {
    if (!CAN_DRAW) return;
    drawing = true;
    livePid = uid();
    livePoints = [pt];
    livePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    livePath.setAttribute('stroke', MY_COLOR);
    livePath.setAttribute('stroke-width', '2');
    livePath.setAttribute('fill', 'none');
    livePath.setAttribute('stroke-linecap', 'round');
    livePath.setAttribute('stroke-linejoin', 'round');
    livePath.style.pointerEvents = 'none';
    liveGroup.appendChild(livePath);
  }

  function penMove(pt) {
    if (!drawing || !livePath) return;
    livePoints.push(pt);
    if (livePoints.length > 1) livePath.setAttribute('d', smoothD(livePoints));
  }

  function penUp() {
    if (!drawing || !livePath) return;
    drawing = false;
    const d = smoothD(livePoints);
    liveGroup.innerHTML = '';
    if (d && livePoints.length >= 2) {
      const data = { type: 'path', id: livePid, color: MY_COLOR, d, sw: 2, slide: currentSlide };
      addPathEl(data);
      send(data);
      refreshDeck();
    }
    livePath = null; livePoints = []; livePid = null;
  }

  // ── Text tool ─────────────────────────────────────────────────────────────
  function placeText(pt) {
    if (!CAN_DRAW) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'canvas-textbox-input';
    const sr = surface.getBoundingClientRect();
    const cp = userToClient(pt);
    input.style.left  = (cp.x - sr.left) + 'px';
    input.style.top   = (cp.y - sr.top - 16) + 'px';
    input.style.color = MY_COLOR;
    input.style.borderColor = MY_COLOR;
    surface.appendChild(input);
    input.focus();

    let committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      const text = input.value.trim();
      input.remove();
      if (!text) return;
      const id = uid();
      const data = { type: 'text', id, x: pt.x, y: pt.y, content: text, color: MY_COLOR, slide: currentSlide };
      addTextEl(data);
      send(data);
      refreshDeck();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; input.remove(); }
    });
    input.addEventListener('blur', commit);
  }

  // ── Surface pointer events ────────────────────────────────────────────────
  surface.addEventListener('mousedown', e => {
    if (!CAN_DRAW && tool !== 'select') return;
    // Clicks on an element are handled by the element's own listener
    if (e.target !== svg && e.target !== elGroup && e.target !== liveGroup && !e.target.id.startsWith('draw')) {
      // probably on a child element — let it bubble up to onElemMouseDown / onElemClick
      if (tool !== 'pen') return;
    }
    if (tool === 'pen')   { penDown(svgPt(e)); }
    if (tool === 'text')  { placeText(svgPt(e)); }
    if (tool === 'select') { clearSelection(); }
  });

  surface.addEventListener('mousemove', e => {
    if (tool === 'pen') penMove(svgPt(e));
  });

  surface.addEventListener('mouseup', () => {
    if (tool === 'pen') penUp();
  });

  surface.addEventListener('mouseleave', () => {
    if (tool === 'pen' && drawing) penUp();
  });

  // ── Zoom and pan ──────────────────────────────────────────────────────────
  // A reader who cannot draw still has to be able to see, so none of this is
  // behind CAN_DRAW.
  let gesture = null;
  let panFrom = null;

  function pinchOf(e) {
    const a = e.touches[0], b = e.touches[1];
    return {
      cx: (a.clientX + b.clientX) / 2,
      cy: (a.clientY + b.clientY) / 2,
      d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)
    };
  }

  function abortStroke() {
    if (!drawing) return;
    drawing = false;
    liveGroup.innerHTML = '';
    livePath = null; livePoints = []; livePid = null;
  }

  surface.addEventListener('wheel', e => {
    e.preventDefault();
    zoomBy(e.clientX, e.clientY, e.deltaY > 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  const fitBtn = document.getElementById('draw-fit');
  if (fitBtn) fitBtn.addEventListener('click', () => fitView(true));

  window.addEventListener('resize', () => {
    if (viewPinned) applyView(); else fitView(false);
  });
  window.addEventListener('orientationchange', () => setTimeout(() => {
    if (viewPinned) applyView(); else fitView(false);
  }, 250));

  // ── Touch events ──────────────────────────────────────────────────────────
  surface.addEventListener('touchstart', e => {
    // Two fingers is always the view, never the pen - and it cancels a stroke
    // the first finger had already begun, so a pinch cannot leave a scribble.
    if (e.touches.length >= 2) {
      e.preventDefault();
      abortStroke();
      panFrom = null;
      const t = pinchOf(e);
      gesture = { d: t.d, anchor: svgPt({ clientX: t.cx, clientY: t.cy }) };
      return;
    }
    if (tool === 'select') {
      panFrom = { client: { x: e.touches[0].clientX, y: e.touches[0].clientY },
                  view: { x: view.x, y: view.y } };
    }
    if (!CAN_DRAW) return;
    if (tool === 'pen') {
      e.preventDefault();
      penDown(touchSvgPt(e));
    } else if (tool === 'text') {
      e.preventDefault();
      placeText(touchSvgPt(e));
    } else if (tool === 'select') {
      // Tapping an element selects it via its own listener; an empty-surface
      // tap clears the current selection.
      if (e.target === svg || e.target === elGroup || e.target === liveGroup) {
        clearSelection();
      }
    }
  }, { passive: false });

  surface.addEventListener('touchmove', e => {
    if (gesture && e.touches.length >= 2) {
      e.preventDefault();
      const t = pinchOf(e);
      if (t.d > 0 && gesture.d > 0) {
        const nw = Math.min(BOARD.w * 60, Math.max(30, view.w * (gesture.d / t.d)));
        view.h *= nw / view.w;
        view.w = nw;
        gesture.d = t.d;
      }
      applyView();
      const now = svgPt({ clientX: t.cx, clientY: t.cy });
      view.x += gesture.anchor.x - now.x;
      view.y += gesture.anchor.y - now.y;
      viewPinned = true;
      applyView();
      return;
    }
    if (panFrom && e.touches.length === 1) {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      if (r.width > 0) {
        const k = view.w / r.width;
        view.x = panFrom.view.x - (e.touches[0].clientX - panFrom.client.x) * k;
        view.y = panFrom.view.y - (e.touches[0].clientY - panFrom.client.y) * k;
        viewPinned = true;
        applyView();
      }
      return;
    }
    if (tool !== 'pen') return;
    e.preventDefault();
    penMove(touchSvgPt(e));
  }, { passive: false });

  surface.addEventListener('touchend', e => {
    if (gesture) {
      e.preventDefault();
      if (e.touches.length < 2) gesture = null;
      return;
    }
    if (panFrom) { panFrom = null; return; }
    if (tool !== 'pen') return;
    e.preventDefault();
    penUp();
  }, { passive: false });

  surface.addEventListener('touchcancel', () => {
    gesture = null; panFrom = null; abortStroke();
  });

  // ── File drop ─────────────────────────────────────────────────────────────
  surface.addEventListener('dragover', e => e.preventDefault());

  function handleImageFile(file, pt) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const id = uid();
      const data = { type: 'image', id, x: pt.x - 100, y: pt.y - 75, w: 200, h: 150, src: reader.result, slide: currentSlide };
      addImageEl(data);
      send(data);
      refreshDeck();
    };
    reader.readAsDataURL(file);
  }

  surface.addEventListener('drop', e => {
    if (!CAN_DRAW) return;
    e.preventDefault();
    handleImageFile(e.dataTransfer.files[0], svgPt(e));
  });

  fileInput.addEventListener('change', () => {
    if (!CAN_DRAW) { fileInput.value = ''; return; }
    const file = fileInput.files[0];
    handleImageFile(file, { x: view.x + view.w / 2, y: view.y + view.h / 2 });
    fileInput.value = '';
  });

  // ── Clear button ──────────────────────────────────────────────────────────
  document.getElementById('draw-clear').addEventListener('click', () => {
    if (!CAN_DRAW) return;
    if (!confirm(`Clear slide ${currentSlide}? This cannot be undone.`)) return;
    clearSlideLocally(currentSlide);
    refreshDeck();
    send({ type: 'clear', slide: currentSlide });
  });

  // ── Send to Skippy ────────────────────────────────────────────────────────
  const submitBtn = document.getElementById('draw-submit');
  if (submitBtn) {
    submitBtn.addEventListener('click', async () => {
      if (!CAN_DRAW) return;
      const prev = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.textContent = 'sending…';
      try {
        const r = await fetch('/canvas/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        submitBtn.textContent = r.ok ? 'sent to Skippy ✓' : 'send failed';
      } catch (e) {
        submitBtn.textContent = 'send failed';
      }
      setTimeout(() => { submitBtn.innerHTML = prev; submitBtn.disabled = false; }, 2500);
    });
  }

  // ── Connect ───────────────────────────────────────────────────────────────
  refreshDeck();
  connectWs();
})();
</script>
{% endblock %}
